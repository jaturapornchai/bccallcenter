services:
  bccallcenter-pg:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: bccallcenter-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BRAIN_PG_DB:-bccallcenter_brain}
      POSTGRES_USER: ${BRAIN_PG_USER:-bcbrain}
      POSTGRES_PASSWORD: ${BRAIN_PG_PASSWORD:?Set BRAIN_PG_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:5446:5432"
    volumes:
      - bccallcenter_pgdata:/var/lib/postgresql
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "hnsw.ef_search=64"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BRAIN_PG_USER:-bcbrain} -d ${BRAIN_PG_DB:-bccallcenter_brain}"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  bccallcenter_pgdata:
