; Asterisk Dialplan: Inbound-Only -> LiveKit SIP + Transfer to Human Staff

[from-yalecom]
; รับสายเข้าจาก Yalecom ทุกเบอร์ (5 คู่สายพร้อมกัน) แล้วส่งต่อเข้า LiveKit SIP
exten => _X.,1,NoOp(Inbound call from ${CALLERID(num)} to ${EXTEN})
 same => n,Set(CALLERID(num)=${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN}@livekit-sip,60)
 same => n,Hangup()

[from-livekit]
; รองรับ SIP REFER (Transfer) จาก LiveKit Agent ไปยังเบอร์ต่อเจ้าหน้าที่ภายใน
exten => _1XX,1,NoOp(Transfer from J.A.R.V.I.S to internal extension ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},45)
 same => n,Hangup()

; ปิดการโทรออกภายนอก (Inbound-Only Policy)
exten => _0X.,1,NoOp(Outbound dialing blocked by Inbound-Only policy: ${EXTEN})
 same => n,Congestion()
 same => n,Hangup()
