<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>BC Call Center + J.A.R.V.I.S 4K Showcase</title>
<style>
  :root {
    --ink: #0f172a;
    --muted: #475569;
    --dim: #64748b;
    --line: rgba(15, 23, 42, 0.10);
    --line-strong: rgba(15, 23, 42, 0.16);
    --card: rgba(255, 255, 255, 0.90);
    --emerald: #059669;
    --emerald-soft: rgba(5, 150, 105, 0.12);
    --sky: #0284c7;
    --sky-soft: rgba(2, 132, 199, 0.12);
    --violet: #7c3aed;
    --violet-soft: rgba(124, 58, 237, 0.12);
    --amber: #d97706;
    --amber-soft: rgba(217, 119, 6, 0.14);
    --rose: #e11d48;
    --rose-soft: rgba(225, 29, 72, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: "Leelawadee UI", "Tahoma", "Segoe UI", system-ui, sans-serif;
    background: #f8fafc;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background:
      radial-gradient(circle at 12% 14%, rgba(14, 165, 233, 0.14), transparent 42%),
      radial-gradient(circle at 86% 18%, rgba(124, 58, 237, 0.12), transparent 44%),
      radial-gradient(circle at 52% 88%, rgba(16, 185, 129, 0.12), transparent 46%),
      linear-gradient(155deg, #ffffff 0%, #f1f5f9 52%, #eef2ff 100%);
  }

  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(15, 23, 42, 0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(15, 23, 42, 0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  .orb {
    position: absolute;
    border-radius: 999px;
    filter: blur(60px);
    pointer-events: none;
  }

  /* Top broadcast chrome */
  .topbar {
    position: absolute;
    top: 26px;
    left: 64px;
    right: 64px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    z-index: 30;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    border: 1.5px solid var(--line);
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    font-weight: 700;
    font-size: 19px;
    line-height: 1.2;
  }
  .brand-dot {
    width: 12px;
    height: 12px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--sky), var(--emerald));
    box-shadow: 0 0 12px rgba(2, 132, 199, 0.45);
  }
  .demo-pill {
    background: #fffbeb;
    border: 1.5px solid rgba(217, 119, 6, 0.45);
    color: #92400e;
  }
  .demo-dot {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: #f59e0b;
  }

  .progress-wrap {
    flex: 1;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .chapter-label {
    font-size: 18px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.2px;
  }
  .progress-track {
    width: 100%;
    height: 7px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.09);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--sky), var(--violet), var(--emerald));
  }

  /* Main content viewport */
  .main {
    position: absolute;
    top: 102px;
    left: 64px;
    right: 64px;
    bottom: 132px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 20;
  }

  .scene-head {
    text-align: center;
    margin-bottom: 22px;
  }
  .scene-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 700;
    background: var(--sky-soft);
    color: var(--sky);
    border: 1px solid rgba(2, 132, 199, 0.25);
    margin-bottom: 10px;
  }
  .scene-title {
    font-size: 46px;
    font-weight: 800;
    line-height: 1.22;
    color: var(--ink);
    letter-spacing: -0.4px;
  }

  .glass-card {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 26px;
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    backdrop-filter: blur(12px);
  }

  /* Screen showcase frame */
  .screen-shell {
    position: relative;
    width: 1460px;
    height: 720px;
    margin: 0 auto;
    border-radius: 24px;
    background: #ffffff;
    border: 2px solid rgba(15, 23, 42, 0.14);
    box-shadow: 0 28px 70px rgba(15, 23, 42, 0.14);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .browser-chrome {
    height: 46px;
    padding: 0 20px;
    background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    border-bottom: 1px solid rgba(15, 23, 42, 0.10);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .win-dots { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .win-dots span { width: 12px; height: 12px; border-radius: 999px; display: inline-block; flex-shrink: 0; }
  .addr-bar {
    padding: 5px 18px;
    border-radius: 999px;
    background: #ffffff;
    border: 1px solid rgba(15, 23, 42, 0.10);
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
  }
  .demo-corner {
    padding: 4px 14px;
    border-radius: 999px;
    background: #fef3c7;
    border: 1px solid rgba(217, 119, 6, 0.45);
    color: #92400e;
    font-size: 14px;
    font-weight: 700;
  }
  .screen-viewport {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: #f8fafc;
  }
  .screen-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    transform-origin: center center;
  }
  .callout-box {
    position: absolute;
    border: 3px solid #059669;
    border-radius: 18px;
    box-shadow: 0 0 0 6px rgba(5, 150, 105, 0.18), 0 18px 40px rgba(5, 150, 105, 0.25);
    pointer-events: none;
  }
  .callout-tag {
    position: absolute;
    left: 24px;
    bottom: 24px;
    padding: 12px 22px;
    border-radius: 16px;
    background: rgba(15, 23, 42, 0.90);
    color: #ffffff;
    font-size: 21px;
    font-weight: 700;
    box-shadow: 0 14px 30px rgba(15, 23, 42, 0.26);
    border: 1px solid rgba(255, 255, 255, 0.22);
    z-index: 5;
  }

  /* Bottom subtitle + CTA bar */
  .bottombar {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 26px;
    height: 92px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    z-index: 40;
  }
  .subtitle-pill {
    flex: 1;
    max-width: 1380px;
    padding: 18px 30px;
    border-radius: 20px;
    background: rgba(15, 23, 42, 0.92);
    color: #ffffff;
    font-size: 27px;
    font-weight: 600;
    line-height: 1.38;
    box-shadow: 0 16px 38px rgba(15, 23, 42, 0.22);
    border: 1px solid rgba(255, 255, 255, 0.14);
    text-align: center;
    margin: 0 auto;
  }
  .cta-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 26px;
    border-radius: 20px;
    background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
    color: #ffffff;
    box-shadow: 0 16px 36px rgba(5, 150, 105, 0.34);
    border: 2px solid rgba(255, 255, 255, 0.35);
    flex-shrink: 0;
  }
  .cta-badge-title { font-size: 16px; font-weight: 600; opacity: 0.92; }
  .cta-badge-num { font-size: 29px; font-weight: 800; font-family: "Consolas", "Segoe UI", monospace; letter-spacing: 0.5px; }

  .muted { color: var(--muted); }
  .mono { font-family: "Consolas", "Segoe UI", monospace; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="grid-bg"></div>
  <div class="orb" id="orb1" style="width:520px;height:520px;background:rgba(14,165,233,0.16);top:-120px;left:-80px;"></div>
  <div class="orb" id="orb2" style="width:560px;height:560px;background:rgba(124,58,237,0.13);bottom:-160px;right:-100px;"></div>

  <div class="topbar" id="topbar">
    <div class="pill">
      <span class="brand-dot"></span>
      <span>ระบบ BC Call Center • J.A.R.V.I.S</span>
    </div>

    <div class="progress-wrap">
      <div class="chapter-label" id="chapterLabel">บทที่ 1 / 11</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:10%"></div>
      </div>
    </div>

    <div class="pill demo-pill" id="rightTopPill">
      <span class="demo-dot"></span>
      <span id="rightTopText">ข้อมูลสาธิต (Demo Data)</span>
    </div>
  </div>

  <div class="main" id="main"></div>

  <div class="bottombar" id="bottombar">
    <div class="subtitle-pill" id="subtitlePill"></div>
    <div class="cta-badge" id="ctaBadge">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      <div>
        <div class="cta-badge-title">ทดลองคุยกับ AI ฟรี</div>
        <div class="cta-badge-num">02-124-4148</div>
      </div>
    </div>
  </div>
</div>

<script>
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
const fadeInOut = (t, inT = 0.4, outT = 0) => clamp(t / inT);

window.__SCENES = [];
window.__TOTAL_SEC = 260;

window.initTimeline = function(data) {
  window.__SCENES = data.scenes || [];
  window.__TOTAL_SEC = data.totalSec || 260;
};

function renderHeader(scene, localT, globalT) {
  const chapterEl = document.getElementById("chapterLabel");
  chapterEl.textContent = `บทที่ ${scene.index + 1} / ${window.__SCENES.length} • ${scene.tag}`;
  const pct = clamp(globalT / Math.max(1, window.__TOTAL_SEC)) * 100;
  document.getElementById("progressFill").style.width = `${pct.toFixed(2)}%`;

  const rightPill = document.getElementById("rightTopPill");
  const rightText = document.getElementById("rightTopText");
  if (scene.showDemoBadge) {
    rightPill.className = "pill demo-pill";
    rightPill.querySelector("span:first-child").className = "demo-dot";
    rightText.textContent = "ข้อมูลสาธิต (Demo Data • ตัวเลขจำลอง)";
  } else {
    rightPill.className = "pill";
    rightPill.querySelector("span:first-child").className = "brand-dot";
    rightText.textContent = "AI 24 ชม. • 5 คู่สาย • 6 ภาษา";
  }

  const cta = document.getElementById("ctaBadge");
  cta.style.display = scene.index >= 1 && scene.layout !== "cta_finale" ? "inline-flex" : "none";
  const pulse = 1 + 0.022 * Math.sin(globalT * 3.5);
  cta.style.transform = `scale(${pulse.toFixed(3)})`;

  // Subtitles
  const subEl = document.getElementById("subtitlePill");
  const cues = scene.subtitles || [];
  let activeText = cues[0]?.text || scene.title;
  for (const c of cues) {
    if (localT >= c.start && localT <= c.end) {
      activeText = c.text;
      break;
    }
  }
  subEl.textContent = activeText;

  // Drift ambient background orbs deterministically
  const orb1 = document.getElementById("orb1");
  const orb2 = document.getElementById("orb2");
  orb1.style.transform = `translate(${Math.sin(globalT * 0.25) * 40}px, ${Math.cos(globalT * 0.2) * 28}px)`;
  orb2.style.transform = `translate(${Math.cos(globalT * 0.22) * -45}px, ${Math.sin(globalT * 0.18) * 32}px)`;
}

function sceneHeadHtml(scene, alpha) {
  return `
    <div class="scene-head" style="opacity:${alpha};transform:translateY(${(1 - alpha) * 18}px)">
      <div class="scene-tag">${scene.tag}</div>
      <h1 class="scene-title">${scene.title}</h1>
    </div>
  `;
}

function renderPainPoint(scene, localT, dur) {
  const a1 = easeOut(localT / 0.6);
  const a2 = easeOut((localT - 0.5) / 0.6);
  const a3 = easeOut((localT - 1.0) / 0.6);
  const clockAngle = ((localT / Math.max(1, dur)) * 220 - 40) * (Math.PI / 180);
  const missedCount = Math.min(28, 3 + Math.floor(localT * 1.6));
  const wave = (phase) => 0.5 + 0.5 * Math.sin(localT * 5 + phase);
  const times = ["12:15 พักเที่ยง", "18:45 หลังเลิกงาน", "21:30 ค่ำวันเสาร์", "07:20 เช้าวันอาทิตย์"];
  const curTime = times[Math.min(times.length - 1, Math.floor((localT / Math.max(1, dur)) * times.length))];

  return `
    ${sceneHeadHtml(scene, a1)}
    <div style="display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:stretch;width:1640px;margin:0 auto;">
      <div class="glass-card" style="padding:38px;display:flex;flex-direction:column;justify-content:space-between;border-color:rgba(225,29,72,0.28);background:rgba(255,255,255,0.94);opacity:${a2}">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="display:inline-flex;align-items:center;gap:12px;padding:10px 20px;border-radius:999px;background:var(--rose-soft);color:var(--rose);font-size:21px;font-weight:800;">
            <span style="width:12px;height:12px;border-radius:999px;background:var(--rose);transform:scale(${(0.8 + 0.5 * wave(0)).toFixed(2)})"></span>
            <span>เวลา: ${curTime}</span>
          </div>
          <div class="mono" style="font-size:22px;font-weight:800;color:var(--rose);">สายหลุดสะสม: ${missedCount} สาย</div>
        </div>

        <div style="display:flex;align-items:center;justify-content:center;gap:42px;margin:28px 0;">
          <svg width="240" height="240" viewBox="0 0 240 240">
            <circle cx="120" cy="120" r="102" fill="#fff1f2" stroke="rgba(225,29,72,0.28)" stroke-width="5"/>
            <circle cx="120" cy="120" r="${88 + 18 * wave(0)}" fill="none" stroke="rgba(225,29,72,${(0.32 * (1 - wave(0))).toFixed(2)})" stroke-width="4"/>
            <line x1="120" y1="120" x2="${120 + Math.cos(clockAngle) * 66}" y2="${120 + Math.sin(clockAngle) * 66}" stroke="#be123c" stroke-width="7" stroke-linecap="round"/>
            <line x1="120" y1="120" x2="${120 + Math.cos(clockAngle * 2.5) * 44}" y2="${120 + Math.sin(clockAngle * 2.5) * 44}" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
            <circle cx="120" cy="120" r="9" fill="#be123c"/>
          </svg>
          <div style="display:flex;flex-direction:column;gap:16px;flex:1;">
            ${[1, 2, 3, 4, 5].map((n) => `
              <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-radius:14px;background:${n <= 3 ? "#fff1f2" : "#f8fafc"};border:1.5px solid ${n <= 3 ? "rgba(225,29,72,0.32)" : "rgba(15,23,42,0.08)"};">
                <span style="font-size:20px;font-weight:700;color:${n <= 3 ? "#be123c" : "#64748b"};">สายเรียกเข้า #${n}</span>
                <span style="font-size:18px;font-weight:700;color:${n <= 3 ? "#e11d48" : "#94a3b8"};">${n <= 3 ? "ไม่มีคนรับ (สายหลุด)" : "รอสายนาน • วางสาย"}</span>
              </div>
            `).join("")}
          </div>
        </div>

        <div style="padding:18px 24px;border-radius:18px;background:#fff1f2;border:1.5px solid rgba(225,29,72,0.22);font-size:23px;font-weight:700;color:#9f1239;text-align:center;">
          เสียทั้งยอดขายลูกค้าใหม่ + ลูกค้าเก่าหนีไปหาคู่แข่งที่ตอบไวกว่า
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:22px;justify-content:center;opacity:${a3}">
        ${[
          { num: "01", title: "พนักงานหน้าร้าน/ฝ่ายขายมีจำกัด", desc: "กำลังติดลูกค้าหน้าร้าน หรือติดคุยสายแรกอยู่ พอสายที่ 2–5 โทรเข้ามาพร้อมกันก็รับไม่ได้", tone: "rose" },
          { num: "02", title: "นอกเวลางาน & วันหยุด ไม่มีทีมสแตนด์บาย", desc: "เจ้าของกิจการ SME ส่วนใหญ่ได้รับสายสอบถามราคาช่วงเย็น ค่ำ และเสาร์อาทิตย์ แต่ไม่มีพนักงานรับ", tone: "amber" },
          { num: "03", title: "ตอบไม่สม่ำเสมอ & ไม่มีบันทึกส่งต่อ", desc: "ลูกค้าโทรซ้ำต้องเล่าปัญหาใหม่ หรือพนักงานจำข้อมูลไม่ได้ว่านัดโทรกลับเรื่องอะไร", tone: "sky" },
        ].map((c, idx) => `
          <div class="glass-card" style="padding:28px 30px;display:flex;align-items:flex-start;gap:22px;transform:translateX(${(1 - easeOut((localT - 0.5 - idx * 0.35) / 0.5)) * 36}px)">
            <div class="mono" style="width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;background:var(--${c.tone}-soft);color:var(--${c.tone});flex-shrink:0;">${c.num}</div>
            <div>
              <div style="font-size:27px;font-weight:800;color:var(--ink);margin-bottom:8px;">${c.title}</div>
              <div style="font-size:21px;line-height:1.45;color:var(--muted);">${c.desc}</div>
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function renderIntroHero(scene, localT) {
  const a1 = easeOut(localT / 0.6);
  const a2 = easeOut((localT - 0.4) / 0.6);
  const bars = Array.from({ length: 24 }, (_, i) => {
    const h = 18 + 52 * (0.5 + 0.5 * Math.sin(localT * 6.2 + i * 0.48));
    return `<div style="width:10px;height:${h.toFixed(1)}px;border-radius:999px;background:linear-gradient(180deg,#0284c7,#059669)"></div>`;
  }).join("");

  return `
    ${sceneHeadHtml(scene, a1)}
    <div style="display:grid;grid-template-columns:1fr 1.15fr;gap:36px;align-items:center;width:1660px;margin:0 auto;opacity:${a2}">
      <div class="glass-card" style="padding:40px;text-align:center;position:relative;overflow:hidden;border-color:rgba(2,132,199,0.28);">
        <div style="display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;background:var(--emerald-soft);color:var(--emerald);font-size:19px;font-weight:800;margin-bottom:24px;">
          <span>รับสายอัตโนมัติพร้อมกันสูงสุด 5 คู่สาย • 24/7</span>
        </div>
        <div style="width:200px;height:200px;margin:0 auto;border-radius:999px;background:radial-gradient(circle,#e0f2fe 0%,#bae6fd 55%,#7dd3fc 100%);display:flex;align-items:center;justify-content:center;border:4px solid #0284c7;box-shadow:0 0 0 ${14 + 8 * Math.sin(localT * 4)}px rgba(2,132,199,0.14);">
          <div style="text-align:center;">
            <div style="font-size:36px;font-weight:900;color:#0369a1;letter-spacing:1px;">J.A.R.V.I.S</div>
            <div style="font-size:17px;font-weight:700;color:#0f172a;margin-top:4px;">Voice AI Engine</div>
          </div>
        </div>
        <div style="height:82px;display:flex;align-items:center;justify-content:center;gap:7px;margin:24px 0 18px;">${bars}</div>
        <div style="padding:18px 26px;border-radius:20px;background:linear-gradient(135deg,#059669,#0d9488);color:#fff;display:inline-flex;align-items:center;gap:14px;box-shadow:0 14px 30px rgba(5,150,105,0.28);">
          <span style="font-size:21px;font-weight:700;">ทดลองโทรคุยจริง:</span>
          <span class="mono" style="font-size:34px;font-weight:900;">02-124-4148</span>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:24px;">
        <div class="glass-card" style="padding:32px;border-left:8px solid var(--sky);">

function renderScreenScene(scene, localT, dur) {
  const a1 = easeOut(localT / 0.5);

  // Gentle smooth zoom & pan (Ken Burns)
  const zoom = 1 + 0.035 * Math.sin(progress * Math.PI);
  const panY = -10 * Math.sin(progress * Math.PI);
  const c = scene.callout || { x: 0.1, y: 0.2, w: 0.8, h: 0.6, label: scene.title };
  const pulse = 0.7 + 0.3 * Math.sin(localT * 4.5);

  return `

          <span style="background:#f59e0b;"></span>

        </div>
        <div class="addr-bar">https://callcenter.bcsmethai.com/</div>
        <div class="demo-corner">⚠️ ข้อมูลสาธิต (Demo Data)</div>
      </div>

      <div class="screen-viewport">
        <img class="screen-img" src="../videos/assets/${scene.screenshot}" style="opacity:${(1 - cross).toFixed(3)};transform:scale(${zoom.toFixed(4)}) translateY(${panY.toFixed(1)}px)" />
        ${hasSecond ? `<img class="screen-img" src="../videos/assets/${scene.secondaryScreenshot}" style="opacity:${cross.toFixed(3)};transform:scale(${(1 + 0.025 * Math.sin((progress - 0.5) * Math.PI * 2)).toFixed(4)})" />` : ""}

        ${!showSecond ? `
          <div class="callout-box" style="left:${c.x * 100}%;top:${c.y * 100}%;width:${c.w * 100}%;height:${c.h * 100}%;opacity:${(easeOut((localT - 0.7) / 0.5) * pulse).toFixed(3)};"></div>

      </div>
    </div>
  `;
}

window.renderAt = function(sceneIdx, localT, sceneDur, globalT) {
  const scene = window.__SCENES[sceneIdx];
  if (!scene) return;
  renderHeader(scene, localT, globalT);
  const main = document.getElementById("main");
  if (scene.layout === "pain_point") main.innerHTML = renderPainPoint(scene, localT, sceneDur);
  else if (scene.layout === "intro_hero") main.innerHTML = renderIntroHero(scene, localT);
  else if (scene.layout === "architecture") main.innerHTML = renderArchitecture(scene, localT);
  else if (scene.layout === "multilang") main.innerHTML = renderMultilang(scene, localT);
  else if (scene.layout === "screen") main.innerHTML = renderScreenScene(scene, localT, sceneDur);
  else if (scene.layout === "sme_value") main.innerHTML = renderSmeValue(scene, localT, sceneDur);
  else if (scene.layout === "cta_finale") main.innerHTML = renderCtaFinale(scene, localT, globalT);
};
